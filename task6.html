<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do List</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>

.light-bg{
  background: linear-gradient(135deg,#6366f1,#06b6d4,#9333ea);
  background-size: 400% 400%;
  animation: gradient 10s ease infinite;
}

.dark-bg{
  background: linear-gradient(135deg,#020617,#0f172a,#1e293b);
  background-size: 400% 400%;
  animation: gradient 10s ease infinite;
}

@keyframes gradient{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.completed{
text-decoration: line-through;
opacity:0.6;
}

</style>
</head>

<body id="body" class="light-bg min-h-screen flex items-center justify-center transition-all duration-500">

<!-- CARD -->
<div class="w-full max-w-md bg-white rounded-xl shadow-2xl p-6 border border-gray-200">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
<h1 class="text-2xl font-bold text-black">To-Do List</h1>

<button id="themeToggle"
class="p-2 rounded-full bg-gray-200 hover:bg-gray-300 transition">
<span id="themeIcon">🌙</span>
</button>
</div>

<!-- INPUT -->
<div class="flex gap-2 mb-4">
<input id="taskInput"
type="text"
placeholder="Enter a task..."
class="flex-1 px-4 py-2 border rounded-l-lg focus:ring-2 focus:ring-indigo-400 outline-none">

<button onclick="addTask()"
class="px-4 py-2 bg-indigo-500 text-white rounded-r-lg hover:bg-indigo-600 transition">
Add
</button>
</div>

<ul id="taskList" class="space-y-2"></ul>

</div>

<script>

function addTask(){

let task=document.getElementById("taskInput").value;

if(task.trim()!=""){

let li=document.createElement("li");

li.className="flex justify-between items-center bg-gray-100 px-4 py-2 rounded-lg shadow-sm hover:shadow-md transition";

let span=document.createElement("span");
span.textContent=task;

span.onclick=function(){
span.classList.toggle("completed");
};

let del=document.createElement("button");
del.innerHTML="✕";
del.className="text-red-500 font-bold hover:text-red-700";

del.onclick=function(){
li.remove();
};

li.appendChild(span);
li.appendChild(del);

document.getElementById("taskList").appendChild(li);

document.getElementById("taskInput").value="";
}

}

let toggle=document.getElementById("themeToggle");
let icon=document.getElementById("themeIcon");
let body=document.getElementById("body");

toggle.onclick=function(){

if(body.classList.contains("light-bg")){
body.classList.remove("light-bg");
body.classList.add("dark-bg");
icon.textContent="☀️";
}else{
body.classList.remove("dark-bg");
body.classList.add("light-bg");
icon.textContent="🌙";
}

}

</script>

</body>
</html>
